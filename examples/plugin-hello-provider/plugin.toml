[plugin]
id = "savvagent.hello-provider"
name = "Hello (Provider)"
version = "0.1.0"
world = "plugin-provider"
savvagent = "^0.18"
description = "Minimal echo provider. Returns the last user message as the response."

[exports]
provider-id = "hello-echo"

# No [security] section because this provider does not make HTTP calls and
