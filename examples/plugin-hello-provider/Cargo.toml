# Example external plugin: hello-provider.
#
# This crate is **deliberately outside the workspace** because cargo-component
# needs its own profile + target setup that would clash with the workspace's
# release config. Build it directly with:
#
#     cargo component build --release --target wasm32-unknown-unknown
#
# The resulting `.wasm` exposes a "hello-echo" provider that ignores
# everything except the last user message and returns it verbatim. No HTTP
# calls, no keyring access — useful as a starting point and as a way to
# exercise the host's provider plumbing offline.
[package]
name = "plugin-hello-provider"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same versions as the in-tree fixtures + the other hello examples.
wit-bindgen = "0.41"
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }

[package.metadata.component]
package = "savvagent:plugin"

[package.metadata.component.target]
path = "../../crates/savvagent-plugin-wit/wit"
world = "plugin-provider"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
