[plugin]
id = "savvagent.hello-interactive"
name = "Hello (Interactive)"
version = "0.1.0"
world = "plugin-interactive"
savvagent = "^0.18"
description = "Minimal interactive-world example. Owns a screen rendering 'Hello, world!'. Note: interactive plugins do not register slash commands; this screen is intended to be opened from another (static-world) plugin via Effect::OpenScreen { id = \"hello.screen\" }."

[exports]
screens = ["hello.screen"]
