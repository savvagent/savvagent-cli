# Fault fixture for Task 7: denied-host.wasm.
#
# Implements the `plugin-provider` world. `complete()` calls
# `http_capability::fetch` against a URL whose host is **not** in the
# plugin's `[security] allowed-hosts` list (the test fixture stages a
# manifest with `allowed-hosts = ["api.example.com"]` while the call
# targets `https://evil.example/...`). The host returns
# `HttpError::DeniedHost("evil.example")`; the guest converts that into
# a `ProviderError` so the host can match the trapped string in its
# integration test.
#
# Like the other fixture crates this is deliberately outside the
# workspace; cargo-component requires its own profile + target setup
# that would clash with the workspace's release config.
#
# Build with `just build-fixtures` (from repo root); the resulting wasm
# component is copied to `tests/fixtures/denied-host.wasm` and
# committed.
[package]
name = "fixture-denied-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same pinning as the other Task 7 fault fixtures.
wit-bindgen = "0.41"
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }

[package.metadata.component]
package = "savvagent:plugin"

[package.metadata.component.target]
path = "../../../../savvagent-plugin-wit/wit"
world = "plugin-provider"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
