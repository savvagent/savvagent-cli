[package]
name = "savvagent-plugin-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wasmtime-backed runtime for savvagent external plugins."

# Task 2 ships the SPP↔WIT conversion layer and the host-side bindgen output
# for all three worlds. Task 3 layers manifest parsing, four-path discovery,
# and the `plugin-trust.toml` ledger on top — which is where `walkdir`,
# `sha2`, `toml`, and `anyhow` come in. Task 4 added the static-world
# adapter; Task 5 added the interactive-world adapter. Task 6 (this crate
# revision) adds the provider-world adapter plus the three capability host
# imports: `http-capability` (reqwest), `keyring-capability` (keyring), and
# `progress-capability` (mpsc forward). `reqwest` reuses the workspace pin
# (rustls + http2); `keyring` likewise (the workspace already configures
# the platform-native backends for the TUI's `/connect` flow). `url` is
# pulled in for canonical host parsing in the HTTP allowed-hosts check.
#
# `wasmtime`'s default features include `component-model` and `async`,
# which are exactly what we need — no explicit feature list necessary.
[dependencies]
savvagent-plugin = { workspace = true }
savvagent-plugin-wit = { workspace = true }
savvagent-mcp = { workspace = true }
savvagent-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
keyring = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
