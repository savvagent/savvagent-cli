[package]
name = "fake-lsp"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test-only minimal LSP server used by tool-lsp integration tests."

[lib]
name = "fake_lsp"
path = "src/lib.rs"

[[bin]]
name = "fake-lsp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
lsp-types.workspace = true
