[package]
name = "tool-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "LSP-server bridge as a stdio MCP server (definition, references, hover, symbols, rename, code actions, diagnostics)"

[lib]
name = "tool_lsp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
toml = "0.8"
lsp-types.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
fake-lsp = { path = "tests/fixtures/fake-lsp" }
