# Builds .deb (cargo-deb) and .rpm (cargo-generate-rpm) packages for Linux
# x86_64 and attaches them to the GitHub Release that the autogenerated
# `dist`-driven `release.yml` workflow creates for the same tag.
#
# Deliberately a separate workflow rather than an edit to release.yml:
# release.yml is regenerated by `dist generate` / `dist init` and any
# manual edits to it get silently clobbered on the next run. Triggering on
# `workflow_run` (rather than the same `push: tags` event) means this job
# starts only after the Release workflow has finished creating the
# GitHub Release, so `gh release upload` always has a release to target
# instead of racing dist's multi-platform build matrix.
#
# `cargo deb` / `cargo generate-rpm` only produce Linux packages, so this
# intentionally doesn't attempt macOS or Windows equivalents (those platforms
# use the shell/PowerShell installers dist already generates).
name: Package (deb/rpm)

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  package-linux:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    env:
      # The tag that triggered the upstream Release workflow. For a tag
      # push, `head_branch` on the `workflow_run` event is the tag name
      # itself (GitHub doesn't set `head_ref` for tag builds).
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same system deps as ci.yml: `keyring`'s sync-secret-service backend
      # needs libdbus headers; blitz (savvagent-canvas) needs fontconfig.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev pkg-config

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release -p savvagent --bins

      - name: Build .deb package
        run: cargo deb -p savvagent --no-build

      # Unlike `cargo deb -p`, `cargo-generate-rpm`'s `-p <name>` does not
      # resolve the crate through workspace metadata: it joins the name
      # onto the current directory (`./<name>/Cargo.toml`), which only
      # works for flat single-level workspaces. Since this crate lives at
      # `crates/savvagent`, invoke it from that directory instead, pointing
      # `--target-dir` back at the workspace's shared `target/` so it picks
      # up the release binary built above.
      - name: Build .rpm package
        run: cargo generate-rpm --target-dir ../../target
        working-directory: crates/savvagent

      - name: Verify tag matches a real GitHub Release
        run: gh release view "$TAG" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packages to the release
        run: |
          gh release upload "$TAG" \
            target/debian/*.deb \
            target/generate-rpm/*.rpm \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
